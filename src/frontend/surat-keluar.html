<!-- surat-keluar.html -->
<template id="suratKeluarPage">

  <div class="page-header">
    <div><h2>📤 Surat Keluar</h2><p>Buat & arsip surat keluar dari template</p></div>
    <button class="btn btn-primary" onclick="openFormSuratKeluar()">+ Buat Surat Keluar</button>
  </div>

  <!-- FILTER -->
  <div class="card" style="margin-bottom:20px;">
    <div class="filter-bar">
      <div class="filter-group">
        <label>Kata Kunci</label>
        <input type="text" class="filter-input" id="skFilterKata" placeholder="Perihal / jenis...">
      </div>
      <div class="filter-group">
        <label>Kode Surat</label>
        <input type="text" class="filter-input" id="skFilterKode" placeholder="DL / SKET..." style="width:100px;">
      </div>
      <div class="filter-group">
        <label>Bulan</label>
        <select class="filter-input" id="skFilterBulan">
          <option value="">Semua</option>
          <option value="1">Januari</option><option value="2">Februari</option>
          <option value="3">Maret</option><option value="4">April</option>
          <option value="5">Mei</option><option value="6">Juni</option>
          <option value="7">Juli</option><option value="8">Agustus</option>
          <option value="9">September</option><option value="10">Oktober</option>
          <option value="11">November</option><option value="12">Desember</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Tahun</label>
        <input type="number" class="filter-input" id="skFilterTahun" value="2026" style="width:90px;">
      </div>
      <div class="filter-actions">
        <button class="btn btn-primary" onclick="loadSuratKeluar()">🔍 Cari</button>
        <button class="btn btn-secondary" onclick="resetFilterSK()">Reset</button>
      </div>
    </div>

    <div class="table-wrapper" style="border:none;border-radius:0;">
      <table id="tableSuratKeluar">
        <thead>
          <tr>
            <th>No. Surat</th><th>Tanggal</th><th>Jenis</th>
            <th>Perihal</th><th>Ditujukan</th><th>Jenjang</th>
            <th>Status</th><th style="text-align:center;">Aksi</th>
          </tr>
        </thead>
        <tbody id="tbodySuratKeluar">
          <tr><td colspan="8" class="table-empty">Klik Cari untuk menampilkan data.</td></tr>
        </tbody>
      </table>
    </div>
    <div style="padding:12px 20px;font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;" id="skCount"></div>
  </div>

  <!-- MODAL: WIZARD BUAT SURAT -->
  <template id="tplBuatSurat">
    <div id="wizardStep1">
      <p style="font-size:13px;color:#6b7280;margin-bottom:12px;">Pilih template surat yang akan digunakan:</p>
      <div id="templateList" style="display:grid;gap:8px;">
        <div class="loading-page" style="min-height:80px;"><div class="loading-spinner"></div></div>
      </div>
    </div>

    <div id="wizardStep2" style="display:none;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
        <button class="btn btn-secondary btn-sm" onclick="backToStep1()">← Kembali</button>
        <span style="font-size:13px;font-weight:600;" id="selectedTplName"></span>
      </div>
      <div style="margin-bottom:14px;">
        <label class="form-label" style="font-size:12px;color:#6b7280;">Nomor Surat (Preview)</label>
        <div class="nomor-preview" id="nomorPreview">Memuat...</div>
      </div>
      <div class="form-grid" id="placeholderForm"></div>
      <div class="form-actions">
        <button class="btn btn-secondary" onclick="Modal.close()">Batal</button>
        <button class="btn btn-primary" id="btnGenerateSurat" onclick="generateSurat()">
          📄 Generate PDF
        </button>
      </div>
    </div>
  </template>

</template>

<script>
let _skSelectedTpl = null;

registerPage('surat-keluar', async function(container) {
  container.innerHTML = document.getElementById('suratKeluarPage').innerHTML;
  const now = new Date();
  document.getElementById('skFilterBulan').value = now.getMonth() + 1;
  document.getElementById('skFilterTahun').value = now.getFullYear();
  await loadSuratKeluar();
});

async function loadSuratKeluar() {
  const filter = {
    perihal   : document.getElementById('skFilterKata')?.value || '',
    kodeSurat : document.getElementById('skFilterKode')?.value || '',
    bulan     : document.getElementById('skFilterBulan')?.value || '',
    tahun     : document.getElementById('skFilterTahun')?.value || '',
  };
  const tbody = document.getElementById('tbodySuratKeluar');
  tbody.innerHTML = `<tr><td colspan="8" class="table-empty"><div class="loading-spinner" style="margin:0 auto;width:24px;height:24px;"></div></td></tr>`;
  try {
    const res = await API.getSuratKeluar(filter);
    document.getElementById('skCount').textContent = `${res.data?.length || 0} surat ditemukan`;
    if (!res.data || res.data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" class="table-empty">Tidak ada data surat keluar.</td></tr>`;
      return;
    }
    tbody.innerHTML = res.data.map(s => `
      <tr>
        <td><code style="font-size:11px;">${escHtml(s.noSurat)}</code></td>
        <td>${fmtTanggal(s.tglSurat)}</td>
        <td><span class="badge badge-gray">${escHtml(s.kodeSurat)}</span> ${escHtml(s.jenis)}</td>
        <td>${escHtml(s.perihal)}</td>
        <td>${escHtml(s.ditujukan||'-')}</td>
        <td><span class="badge badge-info">${escHtml(s.jenjang)}</span></td>
        <td>${statusBadge(s.status)}</td>
        <td style="text-align:center;">
          ${s.pdfUrl ? `<a href="${escHtml(s.pdfUrl)}" target="_blank" class="btn btn-sm btn-success">⬇️ PDF</a>` : '—'}
        </td>
      </tr>`).join('');
  } catch(e) { Toast.error('Gagal memuat: ' + e.message); }
}

function resetFilterSK() {
  document.getElementById('skFilterKata').value = '';
  document.getElementById('skFilterKode').value = '';
  document.getElementById('skFilterBulan').value = '';
  loadSuratKeluar();
}

async function openFormSuratKeluar() {
  _skSelectedTpl = null;
  const tpl = document.getElementById('tplBuatSurat');
  Modal.open('📤 Buat Surat Keluar', tpl.innerHTML, { hideFooter: true, large: true });
  // Load templates
  const res = await API.getTemplates(Session.jenjang);
  const listEl = document.getElementById('templateList');
  if (!res.data || res.data.length === 0) {
    listEl.innerHTML = `<p style="color:#6b7280;font-size:13px;">Belum ada template. Tambah template terlebih dahulu.</p>`;
    return;
  }
  listEl.innerHTML = res.data.map(t => `
    <div onclick="selectTemplate('${t.id}','${escHtml(t.nama)}','${escHtml(JSON.stringify(t.placeholders))}','${escHtml(t.kodeSurat)}')"
      style="padding:12px 16px;border:1.5px solid #e5e7eb;border-radius:8px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px;"
      onmouseover="this.style.borderColor='#1a73e8';this.style.background='#f0f6ff'"
      onmouseout="this.style.borderColor='#e5e7eb';this.style.background=''">
      <span style="font-size:22px;">📄</span>
      <div>
        <div style="font-weight:600;font-size:14px;">${escHtml(t.nama)}</div>
        <div style="font-size:12px;color:#6b7280;">Kode: <strong>${escHtml(t.kodeSurat)}</strong> · Klasifikasi: ${escHtml(t.klasifikasi)} · ${escHtml(t.jenjang)}</div>
      </div>
    </div>`).join('');
}

async function selectTemplate(id, nama, placeholdersJson, kode) {
  _skSelectedTpl = { id, nama, placeholders: JSON.parse(placeholdersJson), kode };
  document.getElementById('wizardStep1').style.display = 'none';
  document.getElementById('wizardStep2').style.display = 'block';
  document.getElementById('selectedTplName').textContent = nama;
  // Preview nomor
  const pvRes = await API.previewNomor(id);
  document.getElementById('nomorPreview').textContent = pvRes.data?.preview || '—';
  // Build placeholder form
  const formEl = document.getElementById('placeholderForm');
  // Filter out auto-filled placeholders
  const autoFields = ['no_surat','tanggal','tahun','bulan','nama_sekolah','kode_sekolah','tahun_ajaran','jenjang','dibuat_oleh'];
  const manual = _skSelectedTpl.placeholders.filter(p => !autoFields.includes(p));
  formEl.innerHTML = manual.map(p => `
    <div class="form-group">
      <label class="form-label">${p.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())} <span class="req">*</span></label>
      <input type="text" class="form-control" id="ph_${p}" placeholder="Isi ${p.replace(/_/g,' ')}">
    </div>`).join('') ||
    `<p style="font-size:13px;color:#6b7280;grid-column:1/-1;">Semua field terisi otomatis. Klik Generate PDF.</p>`;
}

function backToStep1() {
  document.getElementById('wizardStep1').style.display = 'block';
  document.getElementById('wizardStep2').style.display = 'none';
}

async function generateSurat() {
  if (!_skSelectedTpl) return;
  const btn = document.getElementById('btnGenerateSurat');
  btn.disabled = true; btn.textContent = '⏳ Membuat PDF...';
  const autoFields = ['no_surat','tanggal','tahun','bulan','nama_sekolah','kode_sekolah','tahun_ajaran','jenjang','dibuat_oleh'];
  const manual = _skSelectedTpl.placeholders.filter(p => !autoFields.includes(p));
  const placeholders = {};
  for (const p of manual) {
    placeholders[p] = document.getElementById(`ph_${p}`)?.value || '';
  }
  try {
    const res = await API.buatSuratKeluar({ templateId: _skSelectedTpl.id, placeholders });
    if (res.success) {
      Toast.success(`✅ Surat dibuat! No: ${res.data.noSurat}`);
      Modal.close();
      loadSuratKeluar();
      if (res.data.pdfUrl) window.open(res.data.pdfUrl, '_blank');
    } else throw new Error(res.message);
  } catch(e) {
    Toast.error('Gagal: ' + e.message);
    btn.disabled = false; btn.textContent = '📄 Generate PDF';
  }
}
</script>
