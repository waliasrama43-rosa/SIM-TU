<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIM-TU — Tata Usaha</title>
<style>
/* ============================================================
   SIM-TU — Main Stylesheet
   Clean, minimal, professional admin dashboard
   ============================================================ */

:root {
  /* Brand Colors */
  --primary:       #1a73e8;
  --primary-dark:  #1557b0;
  --primary-light: #e8f0fe;

  /* Jenjang Color Coding */
  --sd-color:      #e53935;   /* Merah — SD */
  --smp-color:     #1a73e8;   /* Biru — SMP */
  --sma-color:     #546e7a;   /* Abu-biru — SMA */
  --kepala-color:  #6a1b9a;   /* Ungu — Kepala TU */

  /* Neutrals */
  --bg:            #f5f6fa;
  --surface:       #ffffff;
  --border:        #e5e7eb;
  --text-primary:  #111827;
  --text-secondary:#6b7280;
  --text-muted:    #9ca3af;

  /* Status */
  --success:       #16a34a;
  --success-light: #dcfce7;
  --warning:       #d97706;
  --warning-light: #fef3c7;
  --danger:        #dc2626;
  --danger-light:  #fef2f2;
  --info:          #0284c7;
  --info-light:    #e0f2fe;

  /* Sidebar */
  --sidebar-w:     240px;
  --sidebar-w-col: 64px;
  --sidebar-bg:    #0d2137;
  --sidebar-text:  #c9d5e0;
  --sidebar-hover: rgba(255,255,255,.08);
  --sidebar-active:rgba(26,115,232,.25);

  /* Misc */
  --topbar-h:      60px;
  --radius:        10px;
  --radius-sm:     6px;
  --shadow:        0 2px 8px rgba(0,0,0,.08);
  --shadow-md:     0 4px 20px rgba(0,0,0,.12);
  --transition:    .2s ease;
}

/* ── RESET ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  overflow-x: hidden;
}

/* ── SIDEBAR ────────────────────────────────────────── */
.sidebar {
  width: var(--sidebar-w);
  min-height: 100vh;
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  position: fixed;
  left: 0; top: 0; bottom: 0;
  z-index: 100;
  transition: width var(--transition);
  overflow: hidden;
}
.sidebar.collapsed { width: var(--sidebar-w-col); }
.sidebar.collapsed .nav-label,
.sidebar.collapsed .logo-text,
.sidebar.collapsed .user-info,
.sidebar.collapsed .nav-section-label,
.sidebar.collapsed .app-version { display: none; }
.sidebar.collapsed .nav-badge { display: none !important; }

.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 16px;
  border-bottom: 1px solid rgba(255,255,255,.07);
  min-height: 64px;
}
.sidebar-logo { display: flex; align-items: center; gap: 10px; overflow: hidden; }
.logo-icon { font-size: 24px; flex-shrink: 0; }
.logo-text { display: flex; flex-direction: column; line-height: 1.2; }
.logo-title { font-size: 16px; font-weight: 700; color: #fff; }
.logo-sub   { font-size: 11px; color: var(--sidebar-text); }

.sidebar-toggle {
  background: none; border: none; color: var(--sidebar-text);
  cursor: pointer; font-size: 18px; padding: 4px;
  border-radius: 4px; flex-shrink: 0; line-height: 1;
}
.sidebar-toggle:hover { color: #fff; background: var(--sidebar-hover); }

.user-badge {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid rgba(255,255,255,.07);
}
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--primary);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.user-info { display: flex; flex-direction: column; overflow: hidden; }
.user-name  { font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-role  { font-size: 11px; color: var(--sidebar-text); }

.sidebar-nav {
  flex: 1;
  padding: 8px 0;
  overflow-y: auto;
  overflow-x: hidden;
}
.sidebar-nav::-webkit-scrollbar { width: 4px; }
.sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 2px; }

.nav-section-label {
  font-size: 10px; font-weight: 700; letter-spacing: 1px;
  color: rgba(255,255,255,.3);
  padding: 12px 16px 4px;
  text-transform: uppercase;
  white-space: nowrap;
}

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px;
  color: var(--sidebar-text);
  text-decoration: none;
  border-radius: 0;
  transition: background var(--transition), color var(--transition);
  position: relative;
  white-space: nowrap;
}
.nav-item:hover  { background: var(--sidebar-hover); color: #fff; }
.nav-item.active {
  background: var(--sidebar-active);
  color: #fff;
  border-right: 3px solid var(--primary);
}
.nav-icon { font-size: 16px; flex-shrink: 0; width: 20px; text-align: center; }
.nav-badge {
  margin-left: auto;
  background: var(--danger);
  color: #fff;
  font-size: 11px; font-weight: 700;
  padding: 1px 6px;
  border-radius: 10px;
  min-width: 20px; text-align: center;
}

.sidebar-footer {
  padding: 12px;
  border-top: 1px solid rgba(255,255,255,.07);
}
.btn-logout {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 9px 12px;
  background: none; border: 1px solid rgba(255,255,255,.12);
  color: var(--sidebar-text); border-radius: var(--radius-sm);
  cursor: pointer; font-size: 13px; transition: all var(--transition);
}
.btn-logout:hover { background: rgba(220,38,38,.2); border-color: rgba(220,38,38,.4); color: #f87171; }
.app-version { text-align: center; font-size: 11px; color: rgba(255,255,255,.2); margin-top: 8px; }

/* ── MAIN WRAPPER ──────────────────────────────────── */
.main-wrapper {
  margin-left: var(--sidebar-w);
  flex: 1;
  display: flex;
  flex-direction: column;
  transition: margin-left var(--transition);
  min-height: 100vh;
}
.main-wrapper.sidebar-collapsed { margin-left: var(--sidebar-w-col); }

/* ── TOPBAR ─────────────────────────────────────────── */
.topbar {
  height: var(--topbar-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  position: sticky; top: 0; z-index: 50;
  box-shadow: var(--shadow);
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.mobile-menu-btn {
  display: none; background: none; border: none;
  font-size: 20px; cursor: pointer; color: var(--text-secondary);
}
.breadcrumb { font-size: 16px; font-weight: 600; color: var(--text-primary); }

.topbar-right { display: flex; align-items: center; gap: 16px; }
.topbar-jenjang {
  font-size: 12px; font-weight: 700; padding: 4px 10px;
  border-radius: 20px; background: var(--primary-light); color: var(--primary);
}
.topbar-jenjang.sd  { background: #fde8e8; color: var(--sd-color); }
.topbar-jenjang.smp { background: var(--primary-light); color: var(--primary); }
.topbar-jenjang.sma { background: #eceff1; color: var(--sma-color); }
.topbar-time  { font-size: 13px; color: var(--text-secondary); }
.topbar-user  { font-size: 13px; font-weight: 600; color: var(--text-primary); }

/* ── PAGE CONTENT ──────────────────────────────────── */
.page-content {
  flex: 1;
  padding: 24px;
  overflow-y: auto;
}

/* ── LOADING PAGE ──────────────────────────────────── */
.loading-page {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 300px; gap: 16px; color: var(--text-muted);
}
.loading-spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── CARDS & PANELS ─────────────────────────────────── */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.card-title { font-size: 15px; font-weight: 700; color: var(--text-primary); }
.card-body  { padding: 20px; }

/* ── STAT CARDS ─────────────────────────────────────── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px;
  border: 1px solid var(--border);
  border-left: 4px solid var(--primary);
  box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 16px;
}
.stat-card.danger  { border-left-color: var(--danger); }
.stat-card.success { border-left-color: var(--success); }
.stat-card.warning { border-left-color: var(--warning); }
.stat-icon { font-size: 28px; }
.stat-info { flex: 1; }
.stat-value { font-size: 26px; font-weight: 800; color: var(--text-primary); line-height: 1; }
.stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* ── BUTTONS ────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600;
  border: none; cursor: pointer;
  transition: all var(--transition);
  text-decoration: none;
}
.btn-primary   { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-secondary { background: var(--bg); color: var(--text-primary); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-success   { background: var(--success); color: #fff; }
.btn-success:hover { background: #15803d; }
.btn-danger    { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #b91c1c; }
.btn-warning   { background: var(--warning); color: #fff; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-icon { padding: 7px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ── TABLE ──────────────────────────────────────────── */
.table-wrapper {
  overflow-x: auto;
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
thead tr { background: #f8fafc; }
thead th {
  padding: 11px 14px;
  text-align: left;
  font-weight: 700;
  color: var(--text-secondary);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .5px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tbody tr {
  border-bottom: 1px solid #f1f5f9;
  transition: background var(--transition);
}
tbody tr:hover { background: #f8fafc; }
tbody tr:last-child { border-bottom: none; }
tbody td { padding: 11px 14px; color: var(--text-primary); vertical-align: middle; }
.table-empty { text-align: center; padding: 40px; color: var(--text-muted); }

/* ── FILTER BAR ─────────────────────────────────────── */
.filter-bar {
  display: flex; flex-wrap: wrap; gap: 10px;
  align-items: flex-end;
  padding: 16px 20px;
  background: #f8fafc;
  border-bottom: 1px solid var(--border);
  border-radius: var(--radius) var(--radius) 0 0;
}
.filter-group { display: flex; flex-direction: column; gap: 4px; }
.filter-group label { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; }
.filter-input {
  padding: 7px 10px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-primary);
  background: #fff;
  outline: none;
  min-width: 130px;
  transition: border-color var(--transition);
}
.filter-input:focus { border-color: var(--primary); }
.filter-actions { display: flex; gap: 8px; align-items: flex-end; }

/* ── FORMS ──────────────────────────────────────────── */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group.full { grid-column: 1 / -1; }
.form-label { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.form-label .req { color: var(--danger); margin-left: 2px; }
.form-control {
  padding: 9px 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-primary);
  background: #fff;
  outline: none;
  transition: border-color var(--transition);
  width: 100%;
}
.form-control:focus { border-color: var(--primary); }
.form-control:disabled { background: var(--bg); color: var(--text-muted); }
.form-hint { font-size: 11px; color: var(--text-muted); }
.form-actions {
  display: flex; gap: 10px; justify-content: flex-end;
  padding-top: 8px; border-top: 1px solid var(--border); margin-top: 8px;
}

/* ── BADGES / STATUS ────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center;
  padding: 3px 8px;
  border-radius: 20px;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .3px;
}
.badge-success { background: var(--success-light); color: var(--success); }
.badge-danger  { background: var(--danger-light);  color: var(--danger); }
.badge-warning { background: var(--warning-light); color: var(--warning); }
.badge-info    { background: var(--info-light);    color: var(--info); }
.badge-gray    { background: #f1f5f9; color: var(--text-secondary); }

/* ── MODAL ──────────────────────────────────────────── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 200;
  align-items: center; justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--surface);
  border-radius: var(--radius);
  width: 100%; max-width: 520px;
  max-height: 90vh;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-md);
  animation: modalIn .2s ease;
}
@keyframes modalIn { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-box.modal-lg { max-width: 760px; }
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-header h3 { font-size: 16px; font-weight: 700; }
.modal-close {
  background: none; border: none; font-size: 22px; cursor: pointer;
  color: var(--text-muted); line-height: 1; padding: 2px 6px;
}
.modal-close:hover { color: var(--danger); }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 10px;
}

/* ── TOAST ──────────────────────────────────────────── */
.toast-container {
  position: fixed; bottom: 24px; right: 24px;
  z-index: 300;
  display: flex; flex-direction: column; gap: 10px;
}
.toast {
  min-width: 280px; max-width: 360px;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 12px 16px;
  border-left: 4px solid var(--primary);
  box-shadow: var(--shadow-md);
  display: flex; align-items: center; gap: 10px;
  font-size: 13px;
  animation: toastIn .3s ease;
}
@keyframes toastIn { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.toast.success { border-color: var(--success); }
.toast.error   { border-color: var(--danger); }
.toast.warning { border-color: var(--warning); }
.toast-icon { font-size: 18px; }
.toast-msg  { flex: 1; }

/* ── PAGE HEADER ─────────────────────────────────────── */
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.page-header h2 { font-size: 20px; font-weight: 700; }
.page-header p  { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

/* ── UPLOAD ZONE ─────────────────────────────────────── */
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 32px;
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
  background: #fafbfc;
}
.upload-zone:hover, .upload-zone.dragover {
  border-color: var(--primary);
  background: var(--primary-light);
}
.upload-zone-icon { font-size: 40px; margin-bottom: 10px; }
.upload-zone p { font-size: 13px; color: var(--text-secondary); }
.upload-zone strong { color: var(--primary); }

/* ── PLACEHOLDER PREVIEW ─────────────────────────────── */
.nomor-preview {
  background: var(--primary-light);
  border: 1px solid #c7d7f4;
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-family: monospace;
  font-size: 15px;
  font-weight: 700;
  color: var(--primary-dark);
  letter-spacing: .5px;
}

/* ── TABS ───────────────────────────────────────────── */
.tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
.tab-btn {
  padding: 10px 20px; background: none; border: none;
  font-size: 14px; font-weight: 600; color: var(--text-secondary);
  cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px;
  transition: all var(--transition);
}
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab-btn:hover  { color: var(--primary); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── RESPONSIVE ──────────────────────────────────────── */
@media (max-width: 768px) {
  .sidebar {
    transform: translateX(-100%);
    transition: transform var(--transition);
  }
  .sidebar.mobile-open { transform: translateX(0); }
  .main-wrapper { margin-left: 0; }
  .mobile-menu-btn { display: block; }
  .topbar-time { display: none; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .page-content { padding: 16px; }
}
@media (max-width: 480px) {
  .stats-grid { grid-template-columns: 1fr; }
  .filter-bar { flex-direction: column; align-items: stretch; }
}
</style>
</head>

<script>
/* ============================================================
   SIM-TU — Main JavaScript
   Handles: routing, auth, API calls, UI utilities
   ============================================================ */

'use strict';

// ── SESSION ──────────────────────────────────────────
const Session = {
  get token()   { return sessionStorage.getItem('simtu_token')    || ''; },
  get nama()    { return sessionStorage.getItem('simtu_nama')     || ''; },
  get username(){ return sessionStorage.getItem('simtu_username') || ''; },
  get role()    { return sessionStorage.getItem('simtu_role')     || ''; },
  get jenjang() { return sessionStorage.getItem('simtu_jenjang')  || ''; },
  isKepalaTU()  { return this.role === 'KEPALA_TU'; },
  clear()       { sessionStorage.clear(); },
};


// ── API WRAPPER ───────────────────────────────────────
const API = {
  call(fnName, ...args) {
    return new Promise((resolve, reject) => {
      let runner = google.script.run.withFailureHandler(reject);
      runner = runner.withSuccessHandler(raw => {
        try { resolve(JSON.parse(raw)); }
        catch(e) { resolve({ success: false, message: 'Parse error', data: null }); }
      });
      runner[fnName](...args);
    });
  },
  login(u, p)           { return this.call('loginUser', u, p); },
  logout()              { return this.call('logoutUser', Session.token); },
  getDashboard()        { return this.call('getDashboardData', Session.token); },
  getSuratMasuk(filter) { return this.call('cariSuratMasuk', Session.token, filter); },
  getSuratKeluar(filter){ return this.call('cariSuratKeluar', Session.token, filter); },
  getTemplates(jenjang) { return this.call('getTemplates', Session.token, jenjang); },
  buatSuratKeluar(data) { return this.call('buatSuratKeluar', Session.token, data); },
  catSuratMasuk(data)   { return this.call('catatSuratMasuk', Session.token, data); },
  uploadFoto(b64,mime,nama,jenjang) { return this.call('uploadFotoSurat', Session.token, b64, mime, nama, jenjang); },
  uploadPdf(b64,nama,jenjang)       { return this.call('uploadPdfSurat',  Session.token, b64, nama, jenjang); },
  getDisposisi()        { return this.call('getDisposisiMasuk', Session.token); },
  buatDisposisi(data)   { return this.call('buatDisposisi', Session.token, data); },
  updateDisposisi(id,s) { return this.call('updateStatusDisposisi', Session.token, id, s); },
  getSiswa(jenjang,f)   { return this.call('cariSiswa', Session.token, jenjang, f); },
  tambahSiswa(j,data)   { return this.call('tambahSiswa', Session.token, j, data); },
  getUsers()            { return this.call('getUsers', Session.token); },
  tambahUser(data)      { return this.call('tambahUser', Session.token, data); },
  nonaktifUser(id)      { return this.call('nonaktifUser', Session.token, id); },
  getConfig()           { return this.call('getAllConfig', Session.token); },
  setConfig(k,v)        { return this.call('setConfig', Session.token, k, v); },
  getAuditLog(n)        { return this.call('getAuditLog', Session.token, n); },
  previewNomor(tplId)   { return this.call('previewNomorSurat', Session.token, tplId); },
  tambahTemplate(data)  { return this.call('tambahTemplate', Session.token, data); },
  toggleTemplate(id,s)  { return this.call('toggleTemplate', Session.token, id, s); },
  ajukanPromosi(j,sid)  { return this.call('ajukanPromosi', Session.token, j, sid); },
  konfirmasiPromosi(sid,ok) { return this.call('konfirmasiPromosi', Session.token, sid, ok); },
};


// ── TOAST ─────────────────────────────────────────────
const Toast = {
  show(msg, type='info', duration=3500) {
    const icons = { success:'✅', error:'❌', warning:'⚠️', info:'ℹ️' };
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `<span class="toast-icon">${icons[type]||'ℹ️'}</span>
                    <span class="toast-msg">${msg}</span>`;
    document.getElementById('toastContainer').appendChild(el);
    setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .4s';
      setTimeout(() => el.remove(), 400); }, duration);
  },
  success(m) { this.show(m,'success'); },
  error(m)   { this.show(m,'error',5000); },
  warn(m)    { this.show(m,'warning'); },
};

// ── MODAL ─────────────────────────────────────────────
const Modal = {
  open(title, bodyHtml, opts={}) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML   = bodyHtml;
    const footer = document.getElementById('modalFooter');
    if (opts.hideFooter) { footer.style.display='none'; }
    else {
      footer.style.display='flex';
      document.getElementById('modalConfirm').textContent = opts.confirmText || 'Ya, Lanjutkan';
      document.getElementById('modalConfirm').className   = `btn ${opts.confirmClass||'btn-primary'}`;
    }
    if (opts.large) document.getElementById('modalBox').classList.add('modal-lg');
    else document.getElementById('modalBox').classList.remove('modal-lg');
    document.getElementById('modalOverlay').classList.add('open');
    this._onConfirm = opts.onConfirm || null;
  },
  close() {
    document.getElementById('modalOverlay').classList.remove('open');
    this._onConfirm = null;
  },
  confirm() { if (this._onConfirm) this._onConfirm(); this.close(); },
  _onConfirm: null,
};


// ── ROUTER ────────────────────────────────────────────
const pages = {};   // { pageName: renderFn }

function registerPage(name, fn) { pages[name] = fn; }

async function navigate(page) {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  const titles = {
    'dashboard'   : 'Dashboard',
    'surat-masuk' : 'Surat Masuk',
    'surat-keluar': 'Surat Keluar',
    'disposisi'   : 'Disposisi Surat',
    'kesiswaan'   : 'Data Siswa',
    'template-reg': 'Template Surat',
    'users'       : 'Kelola User',
    'config'      : 'Konfigurasi Sistem',
    'audit-log'   : 'Audit Log',
  };
  document.getElementById('pageTitle').textContent = titles[page] || page;
  const content = document.getElementById('pageContent');
  content.innerHTML = '<div class="loading-page"><div class="loading-spinner"></div><p>Memuat...</p></div>';
  if (pages[page]) { await pages[page](content); }
  else { content.innerHTML = `<div class="loading-page"><p>Halaman tidak ditemukan.</p></div>`; }
}

// ── HELPERS ──────────────────────────────────────────
function fmtTanggal(val) {
  if (!val) return '-';
  const d = new Date(val);
  if (isNaN(d)) return val;
  return d.toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric' });
}
function fmtBulan(n) {
  return ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][n-1] || n;
}
function statusBadge(s) {
  const map = {
    'BARU'        : 'info',    'DIDISPOSISI':'warning', 'SELESAI':'success',
    'MENUNGGU'    : 'warning', 'DITERIMA'   :'info',    'DIPROSES':'info',
    'AKTIF'       : 'success', 'NONAKTIF'   :'danger',  'FINAL'   :'success',
    'PROMOSI_PENDING':'warning','LULUS'      :'gray',    'MUTASI'  :'gray',
  };
  return `<span class="badge badge-${map[s]||'gray'}">${s}</span>`;
}
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}


// ── INIT APP (gerbang autentikasi sisi client) ───────
function initApp() {
  if (!Session.token) { showLogin(); return; }
  buildApp();
}

// ── LOGIN VIEW ────────────────────────────────────────
function showLogin() {
  const overlay = document.createElement('div');
  overlay.id = 'loginOverlay';
  overlay.style.cssText =
    'position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;' +
    'background:linear-gradient(135deg,#1a3c5e 0%,#0d2137 100%);padding:24px;';
  overlay.innerHTML =
    '<div style="width:100%;max-width:400px;background:#fff;border-radius:16px;padding:36px 32px;box-shadow:0 24px 64px rgba(0,0,0,.3);">' +
      '<div style="text-align:center;margin-bottom:28px;">' +
        '<div style="font-size:40px;">🏫</div>' +
        '<h1 style="font-size:22px;color:#1a3c5e;margin-top:8px;">SIM-TU</h1>' +
        '<p style="font-size:13px;color:#6b7280;margin-top:4px;">Sistem Informasi Manajemen Tata Usaha</p>' +
      '</div>' +
      '<div id="loginError" style="display:none;background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;"></div>' +
      '<div class="form-group" style="margin-bottom:16px;">' +
        '<label class="form-label">Username</label>' +
        '<input type="text" class="form-control" id="loginUsername" placeholder="Masukkan username" autofocus>' +
      '</div>' +
      '<div class="form-group" style="margin-bottom:20px;">' +
        '<label class="form-label">Password</label>' +
        '<input type="password" class="form-control" id="loginPassword" placeholder="Masukkan password">' +
      '</div>' +
      '<button class="btn btn-primary" id="btnDoLogin" style="width:100%;justify-content:center;padding:11px;">Masuk</button>' +
      '<p style="text-align:center;margin-top:20px;font-size:12px;color:#9ca3af;">Hanya untuk staf TU terdaftar.</p>' +
    '</div>';
  document.body.appendChild(overlay);

  const doLogin = () => {
    const u   = document.getElementById('loginUsername').value.trim();
    const p   = document.getElementById('loginPassword').value;
    const err = document.getElementById('loginError');
    const btn = document.getElementById('btnDoLogin');
    if (!u || !p) { err.textContent = 'Username dan password wajib diisi.'; err.style.display = 'block'; return; }
    err.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Memproses...';
    google.script.run
      .withSuccessHandler(raw => {
        let res; try { res = JSON.parse(raw); } catch(e) { res = { success:false, message:'Respon tidak valid.' }; }
        if (res.success) {
          sessionStorage.setItem('simtu_token',    res.data.token);
          sessionStorage.setItem('simtu_username', res.data.username);
          sessionStorage.setItem('simtu_nama',     res.data.nama);
          sessionStorage.setItem('simtu_role',     res.data.role);
          sessionStorage.setItem('simtu_jenjang',  res.data.jenjang);
          window.location.reload();
        } else {
          err.textContent = res.message || 'Login gagal.'; err.style.display = 'block';
          btn.disabled = false; btn.textContent = 'Masuk';
        }
      })
      .withFailureHandler(e => {
        err.textContent = 'Kesalahan sistem: ' + e.message; err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Masuk';
      })
      .loginUser(u, p);
  };

  document.getElementById('btnDoLogin').addEventListener('click', doLogin);
  document.getElementById('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}

// ── BUILD APP (setelah login terverifikasi) ──────────
function buildApp() {
  // Populate UI
  document.getElementById('sidebarNama').textContent  = Session.nama;
  document.getElementById('sidebarRole').textContent  = Session.role.replace('_',' ');
  document.getElementById('userAvatar').textContent   = Session.nama.charAt(0).toUpperCase();
  document.getElementById('topbarUser').textContent   = Session.nama;
  const jEl = document.getElementById('topbarJenjang');
  jEl.textContent = Session.jenjang;
  jEl.className   = `topbar-jenjang ${Session.jenjang.toLowerCase()}`;

  // Admin-only menus
  if (!Session.isKepalaTU()) {
    document.querySelectorAll('.admin-only').forEach(el => el.style.display='none');
  }

  // Clock
  function updateClock() {
    document.getElementById('topbarTime').textContent =
      new Date().toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }
  updateClock(); setInterval(updateClock, 1000);

  // Sidebar toggle
  const sidebar     = document.getElementById('sidebar');
  const mainWrapper = document.getElementById('mainWrapper');
  document.getElementById('sidebarToggle').addEventListener('click', () => {
    sidebar.classList.toggle('collapsed');
    mainWrapper.classList.toggle('sidebar-collapsed');
  });
  document.getElementById('mobileMenuBtn').addEventListener('click', () => {
    sidebar.classList.toggle('mobile-open');
  });

  // Nav links
  document.querySelectorAll('.nav-item[data-page]').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault();
      sidebar.classList.remove('mobile-open');
      navigate(el.dataset.page);
    });
  });

  // Modal
  document.getElementById('modalClose').addEventListener('click',  () => Modal.close());
  document.getElementById('modalCancel').addEventListener('click', () => Modal.close());
  document.getElementById('modalConfirm').addEventListener('click',() => Modal.confirm());
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) Modal.close();
  });

  // Logout
  document.getElementById('btnLogout').addEventListener('click', () => {
    Modal.open('Konfirmasi Keluar', '<p>Apakah Anda yakin ingin keluar?</p>', {
      confirmText: 'Ya, Keluar',
      confirmClass: 'btn-danger',
      onConfirm: async () => {
        await API.logout();
        Session.clear();
        window.location.reload();
      }
    });
  });

  // Start on dashboard
  navigate('dashboard');
}

document.addEventListener('DOMContentLoaded', initApp);
</script>

<script>
registerPage('dashboard', async function(container) {
  container.innerHTML = document.getElementById('dashboardPage').innerHTML;
  await loadDashboard();
});

async function loadDashboard() {
  const bulan = new Date().getMonth() + 1;
  const tahun = new Date().getFullYear();
  document.getElementById('dashSubtitle').textContent =
    `${Session.jenjang} · ${fmtBulan(bulan)} ${tahun} · ${Session.nama}`;

  if (Session.isKepalaTU()) document.getElementById('auditCard').style.display = 'block';

  try {
    const res = await API.getDashboard();
    if (res.success && res.data) {
      const d = res.data;
      document.getElementById('statSM').textContent            = d.suratMasukBulanIni  ?? '0';
      document.getElementById('statSK').textContent            = d.suratKeluarBulanIni ?? '0';
      document.getElementById('statBelumDisposisi').textContent= d.belumDisposisi      ?? '0';
      document.getElementById('statDisposisiMasuk').textContent= d.disposisiMenunggu   ?? '0';
      document.getElementById('statSiswa').textContent         = d.totalSiswaAktif     ?? '0';

      // Surat masuk terbaru
      const smEl = document.getElementById('recentSuratMasuk');
      if (d.recentSuratMasuk && d.recentSuratMasuk.length > 0) {
        smEl.innerHTML = `<table style="width:100%;font-size:12px;">
          <thead><tr><th style="padding:8px 14px;">No. Agenda</th><th style="padding:8px 14px;">Perihal</th><th style="padding:8px 14px;">Status</th></tr></thead>
          <tbody>${d.recentSuratMasuk.map(s=>`<tr>
            <td style="padding:8px 14px;font-family:monospace;">${escHtml(s.noAgenda)}</td>
            <td style="padding:8px 14px;">${escHtml(s.perihal)}</td>
            <td style="padding:8px 14px;">${statusBadge(s.status)}</td>
          </tr>`).join('')}</tbody></table>`;
      } else {
        smEl.innerHTML = `<p class="table-empty">Belum ada surat masuk bulan ini.</p>`;
      }

      // Disposisi menunggu
      const dEl = document.getElementById('recentDisposisi');
      if (d.recentDisposisi && d.recentDisposisi.length > 0) {
        dEl.innerHTML = `<table style="width:100%;font-size:12px;">
          <thead><tr><th style="padding:8px 14px;">Perihal</th><th style="padding:8px 14px;">Dari</th><th style="padding:8px 14px;">Level</th></tr></thead>
          <tbody>${d.recentDisposisi.map(s=>`<tr>
            <td style="padding:8px 14px;">${escHtml(s.perihal)}</td>
            <td style="padding:8px 14px;">${escHtml(s.dari)}</td>
            <td style="padding:8px 14px;text-align:center;">${s.level}</td>
          </tr>`).join('')}</tbody></table>`;
      } else {
        dEl.innerHTML = `<p class="table-empty">Tidak ada disposisi menunggu. ✅</p>`;
      }

      // Audit log (Kepala TU)
      if (Session.isKepalaTU() && d.recentAudit) {
        const aEl = document.getElementById('recentAudit');
        aEl.innerHTML = `<table style="width:100%;font-size:12px;">
          <thead><tr><th style="padding:8px 14px;">Waktu</th><th style="padding:8px 14px;">User</th><th style="padding:8px 14px;">Aksi</th><th style="padding:8px 14px;">Detail</th></tr></thead>
          <tbody>${d.recentAudit.slice(0,10).map(a=>`<tr>
            <td style="padding:8px 14px;white-space:nowrap;">${fmtTanggal(a.timestamp)}</td>
            <td style="padding:8px 14px;">${escHtml(a.username)}</td>
            <td style="padding:8px 14px;"><code style="font-size:11px;">${escHtml(a.aksi)}</code></td>
            <td style="padding:8px 14px;color:#6b7280;">${escHtml(a.detail)}</td>
          </tr>`).join('')}</tbody></table>`;
      }
    }
  } catch(e) {
    Toast.error('Gagal memuat data dashboard: ' + e.message);
  }
}
</script>

<script>
let _smUploadData = null;  // { base64, mimeType, nama }
let _dispSuratId  = null;

registerPage('surat-masuk', async function(container) {
  container.innerHTML = document.getElementById('suratMasukPage').innerHTML;
  // Set default filter bulan & tahun
  const now = new Date();
  document.getElementById('smFilterBulan').value = now.getMonth() + 1;
  document.getElementById('smFilterTahun').value = now.getFullYear();
  await loadSuratMasuk();
});

async function loadSuratMasuk() {
  const filter = {
    perihal  : document.getElementById('smFilterKata')?.value || '',
    pengirim : document.getElementById('smFilterKata')?.value || '',
    bulan    : document.getElementById('smFilterBulan')?.value || '',
    tahun    : document.getElementById('smFilterTahun')?.value || '',
    status   : document.getElementById('smFilterStatus')?.value || '',
  };
  const tbody = document.getElementById('tbodySuratMasuk');
  tbody.innerHTML = `<tr><td colspan="8" class="table-empty"><div class="loading-spinner" style="margin:0 auto;width:24px;height:24px;"></div></td></tr>`;
  try {
    const res = await API.getSuratMasuk(filter);
    document.getElementById('smCount').textContent = `${res.data?.length || 0} surat ditemukan`;
    if (!res.data || res.data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" class="table-empty">Tidak ada data surat masuk.</td></tr>`;
      return;
    }
    tbody.innerHTML = res.data.map(s => `
      <tr>
        <td><code style="font-size:11px;">${escHtml(s.noAgenda)}</code></td>
        <td>${fmtTanggal(s.tglTerima)}</td>
        <td style="font-size:12px;">${escHtml(s.noSurat)}</td>
        <td>${escHtml(s.pengirim)}</td>
        <td>${escHtml(s.perihal)}</td>
        <td><span class="badge badge-info">${escHtml(s.jenjang)}</span></td>
        <td>${statusBadge(s.status)}</td>
        <td style="text-align:center;white-space:nowrap;">
          ${s.lampiranUrl ? `<a href="${escHtml(s.lampiranUrl)}" target="_blank" class="btn btn-sm btn-secondary">📄</a>` : ''}
          <button class="btn btn-sm btn-warning" onclick="openDisposisi('${escHtml(s.id)}')">📋</button>
        </td>
      </tr>`).join('');
  } catch(e) { Toast.error('Gagal memuat: ' + e.message); }
}

function resetFilterSM() {
  document.getElementById('smFilterKata').value   = '';
  document.getElementById('smFilterBulan').value  = '';
  document.getElementById('smFilterStatus').value = '';
  loadSuratMasuk();
}

function openFormSuratMasuk() {
  _smUploadData = null;
  const tpl = document.getElementById('tplFormSuratMasuk');
  Modal.open('📥 Catat Surat Masuk', tpl.innerHTML, { hideFooter: true, large: true });
  document.getElementById('smTglTerima').value = new Date().toISOString().slice(0,10);
  setupUploadZone();
}

function switchTabSM(tab, btn) {
  document.querySelectorAll('#modalBody .tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('#modalBody .tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tabUploadSM') && (document.getElementById(tab==='upload'?'tabUploadSM':'tabManualSM').classList.add('active'));
}

function setupUploadZone() {
  const zone = document.getElementById('uploadZoneSM');
  if (!zone) return;
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('dragover');
    if (e.dataTransfer.files[0]) processFileSM(e.dataTransfer.files[0]);
  });
}

function handleFileSM(input) {
  if (input.files[0]) processFileSM(input.files[0]);
}

function processFileSM(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const base64 = e.target.result.split(',')[1];
    _smUploadData = { base64, mimeType: file.type, nama: file.name.replace(/\.[^.]+$/, '') };
    document.getElementById('uploadPreviewSM').style.display = 'block';
    document.getElementById('uploadFilenameSM').textContent  = file.name;
  };
  reader.readAsDataURL(file);
}

async function simpanSuratMasuk() {
  const noSurat  = document.getElementById('smNoSurat')?.value?.trim();
  const pengirim = document.getElementById('smPengirim')?.value?.trim();
  const perihal  = document.getElementById('smPerihal')?.value?.trim();
  if (!noSurat || !pengirim || !perihal) { Toast.warn('Lengkapi field wajib.'); return; }

  const btn = document.getElementById('btnSimpanSM');
  btn.disabled = true; btn.textContent = 'Menyimpan...';

  try {
    let lampiranId = '', lampiranUrl = '';
    if (_smUploadData) {
      const upRes = _smUploadData.mimeType === 'application/pdf'
        ? await API.uploadPdf(_smUploadData.base64, _smUploadData.nama, Session.jenjang)
        : await API.uploadFoto(_smUploadData.base64, _smUploadData.mimeType, _smUploadData.nama, Session.jenjang);
      if (!upRes.success) throw new Error(upRes.message);
      lampiranId  = upRes.data.fileId;
      lampiranUrl = upRes.data.fileUrl;
    }
    const res = await API.catSuratMasuk({
      noSurat, pengirim, perihal,
      tglSurat   : document.getElementById('smTglSurat')?.value,
      tglTerima  : document.getElementById('smTglTerima')?.value,
      klasifikasi: document.getElementById('smKlasifikasi')?.value,
      lampiranId, lampiranUrl,
    });
    if (res.success) {
      Toast.success(`Surat masuk dicatat. No. Agenda: ${res.data.noAgenda}`);
      Modal.close(); loadSuratMasuk();
    } else throw new Error(res.message);
  } catch(e) {
    Toast.error('Gagal menyimpan: ' + e.message);
    btn.disabled = false; btn.textContent = '💾 Simpan';
  }
}

function openDisposisi(suratId) {
  _dispSuratId = suratId;
  const tpl = document.getElementById('tplDisposisi');
  Modal.open('📋 Disposisi Surat', tpl.innerHTML, { hideFooter: true });
  // Isi dropdown user
  API.getUsers().then(res => {
    const sel = document.getElementById('dispKepada');
    if (res.data) res.data.filter(u => u.username !== Session.username && u.status === 'AKTIF').forEach(u => {
      const opt = document.createElement('option');
      opt.value = u.username; opt.textContent = `${u.nama} (${u.role.replace('_',' ')})`;
      sel.appendChild(opt);
    });
  });
}

async function kirimDisposisi() {
  const kepada  = document.getElementById('dispKepada')?.value;
  const catatan = document.getElementById('dispCatatan')?.value;
  if (!kepada) { Toast.warn('Pilih penerima disposisi.'); return; }
  const res = await API.buatDisposisi({ suratId: _dispSuratId, kepada, catatan });
  if (res.success) { Toast.success('Disposisi berhasil dikirim.'); Modal.close(); loadSuratMasuk(); }
  else Toast.error(res.message);
}
</script>

async function openFormSuratKeluar() {
  _skSelectedTpl = null;
  const tpl = document.getElementById('tplBuatSurat');

}

async function selectTemplate(id, nama, placeholdersJson, kode) {
  _skSelectedTpl = { id, nama, placeholders: JSON.parse(placeholdersJson), kode };
  document.getElementById('wizardStep1').style.display = 'none';
  document.getElementById('wizardStep2').style.display = 'block';
  document.getElementById('selectedTplName').textContent = nama;
  // Preview nomor
  const pvRes = await API.previewNomor(id);
  document.getElementById('nomorPreview').textContent = pvRes.data?.preview || '—';
  // Build placeholder form
  const formEl = document.getElementById('placeholderForm');
  // Filter out auto-filled placeholders
  const autoFields = ['no_surat','tanggal','tahun','bulan','nama_sekolah','kode_sekolah','tahun_ajaran','jenjang','dibuat_oleh'];
  const manual = _skSelectedTpl.placeholders.filter(p => !autoFields.includes(p));
  formEl.innerHTML = manual.map(p => `
    <div class="form-group">
      <label class="form-label">${p.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())} <span class="req">*</span></label>
      <input type="text" class="form-control" id="ph_${p}" placeholder="Isi ${p.replace(/_/g,' ')}">
    </div>`).join('') ||
    `<p style="font-size:13px;color:#6b7280;grid-column:1/-1;">Semua field terisi otomatis. Klik Generate PDF.</p>`;
}

function backToStep1() {
  document.getElementById('wizardStep1').style.display = 'block';
  document.getElementById('wizardStep2').style.display = 'none';
}

async function generateSurat() {
  if (!_skSelectedTpl) return;
  const btn = document.getElementById('btnGenerateSurat');
  btn.disabled = true; btn.textContent = '⏳ Membuat PDF...';
  const autoFields = ['no_surat','tanggal','tahun','bulan','nama_sekolah','kode_sekolah','tahun_ajaran','jenjang','dibuat_oleh'];
  const manual = _skSelectedTpl.placeholders.filter(p => !autoFields.includes(p));
  const placeholders = {};
  for (const p of manual) {
    placeholders[p] = document.getElementById(`ph_${p}`)?.value || '';
  }
  try {
    const res = await API.buatSuratKeluar({ templateId: _skSelectedTpl.id, placeholders });
    if (res.success) {
      Toast.success(`✅ Surat dibuat! No: ${res.data.noSurat}`);
      Modal.close();
      loadSuratKeluar();
      if (res.data.pdfUrl) window.open(res.data.pdfUrl, '_blank');
    } else throw new Error(res.message);
  } catch(e) {
    Toast.error('Gagal: ' + e.message);
    btn.disabled = false; btn.textContent = '📄 Generate PDF';
  }
}
</script>

  await loadDisposisi();
});

async function loadDisposisi() {
  const tbody = document.getElementById('tbodyDisposisi');
  tbody.innerHTML = `<tr><td colspan="8" class="table-empty"><div class="loading-spinner" style="margin:0 auto;width:24px;height:24px;"></div></td></tr>`;
  try {
    const res = await API.getDisposisi();
    if (!res.data || res.data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" class="table-empty">✅ Tidak ada disposisi yang menunggu.</td></tr>`;
      document.getElementById('badgeDisposisi') && (document.getElementById('badgeDisposisi').style.display = 'none');
      return;
    }
    const badge = document.getElementById('badgeDisposisi');
    if (badge) { badge.textContent = res.data.length; badge.style.display = 'inline'; }
    tbody.innerHTML = res.data.map(d => `
      <tr>
        <td><code style="font-size:11px;">${escHtml(d.noAgenda)}</code></td>
        <td>${escHtml(d.perihal)}</td>
        <td>${escHtml(d.dari)}</td>
        <td style="max-width:200px;font-size:12px;color:#6b7280;">${escHtml(d.catatan||'—')}</td>
        <td style="text-align:center;"><span class="badge badge-info">Lvl ${d.level}</span></td>
        <td>${statusBadge(d.status)}</td>
        <td>${fmtTanggal(d.tglDisposisi)}</td>
        <td style="text-align:center;white-space:nowrap;">
          <button class="btn btn-sm btn-success" onclick="updateDisp('${d.id}','DITERIMA')">Terima</button>
          <button class="btn btn-sm btn-primary" onclick="updateDisp('${d.id}','DIPROSES')">Proses</button>
          <button class="btn btn-sm btn-secondary" onclick="updateDisp('${d.id}','SELESAI')">Selesai</button>
        </td>
      </tr>`).join('');
  } catch(e) { Toast.error('Gagal memuat: ' + e.message); }
}

async function updateDisp(id, status) {
  const res = await API.updateDisposisi(id, status);
  if (res.success) { Toast.success(`Status disposisi → ${status}`); loadDisposisi(); }
  else Toast.error(res.message);
}
</script>

<script>
let _activeJenjang = Session.jenjang || 'SD';

registerPage('kesiswaan', async function(container) {
  container.innerHTML = document.getElementById('kesiswaanPage').innerHTML;
  // Set tab sesuai jenjang user
  _activeJenjang = Session.jenjang;
  document.querySelectorAll('#jenjangTabs .tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.jenjang === _activeJenjang);
    if (!Session.isKepalaTU() && btn.dataset.jenjang !== Session.jenjang) btn.style.display = 'none';
  });
  await loadSiswa();
});

function switchJenjang(jenjang, btn) {
  _activeJenjang = jenjang;
  document.querySelectorAll('#jenjangTabs .tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadSiswa();
}

async function loadSiswa() {
  const filter = {
    nama   : document.getElementById('siswaFilterNama')?.value || '',
    nisn   : document.getElementById('siswaFilterNisn')?.value || '',
    kelas  : document.getElementById('siswaFilterKelas')?.value || '',
    status : document.getElementById('siswaFilterStatus')?.value || 'AKTIF',
  };
  const tbody = document.getElementById('tbodySiswa');
  tbody.innerHTML = `<tr><td colspan="8" class="table-empty"><div class="loading-spinner" style="margin:0 auto;width:24px;height:24px;"></div></td></tr>`;
  try {
    const res = await API.getSiswa(_activeJenjang, filter);
    document.getElementById('siswaCount').textContent = `${res.data?.length||0} siswa ditemukan di jenjang ${_activeJenjang}`;
    if (!res.data || res.data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" class="table-empty">Tidak ada data siswa.</td></tr>`; return;
    }
    tbody.innerHTML = res.data.map(s => `
      <tr>
        <td style="font-family:monospace;">${escHtml(s.nisn||'—')}</td>
        <td style="font-weight:600;">${escHtml(s.nama)}</td>
        <td>${escHtml(s.kelas||'—')}</td>
        <td>${escHtml(s.rombel||'—')}</td>
        <td>${fmtTanggal(s.tglLahir)}</td>
        <td>${s.jenisKelamin==='L'?'Laki-laki':'Perempuan'}</td>
        <td>${statusBadge(s.status)}</td>
        <td style="text-align:center;white-space:nowrap;">
          ${s.status==='AKTIF' ? `<button class="btn btn-sm btn-warning" onclick="ajukanPromosiSiswa('${s.id}')">⬆️ Promosi</button>` : ''}
        </td>
      </tr>`).join('');
  } catch(e) { Toast.error('Gagal: ' + e.message); }
}

function resetFilterSiswa() {
  document.getElementById('siswaFilterNama').value  = '';
  document.getElementById('siswaFilterNisn').value  = '';
  document.getElementById('siswaFilterKelas').value = '';
  document.getElementById('siswaFilterStatus').value = 'AKTIF';
  loadSiswa();
}

function openFormTambahSiswa() {
  const tpl = document.getElementById('tplFormSiswa');
  Modal.open(`➕ Tambah Siswa — ${_activeJenjang}`, tpl.innerHTML, { hideFooter: true, large: true });
}

async function simpanSiswa() {
  const nisn = document.getElementById('sisNisn')?.value?.trim();
  const nama = document.getElementById('sisNama')?.value?.trim();
  const kelas= document.getElementById('sisKelas')?.value?.trim();
  if (!nisn || !nama || !kelas) { Toast.warn('NISN, Nama, dan Kelas wajib diisi.'); return; }
  const res = await API.tambahSiswa(_activeJenjang, {
    nisn, nama, kelas,
    tempatLahir  : document.getElementById('sisTempatLahir')?.value,
    tglLahir     : document.getElementById('sisTglLahir')?.value,
    jenisKelamin : document.getElementById('sisJenisKelamin')?.value,
    rombel       : document.getElementById('sisRombel')?.value,
    tahunMasuk   : document.getElementById('sisTahunMasuk')?.value,
    namaAyah     : document.getElementById('sisNamaAyah')?.value,
    namaIbu      : document.getElementById('sisNamaIbu')?.value,
    noTelpOrtu   : document.getElementById('sisNoTelp')?.value,
    alamat       : document.getElementById('sisAlamat')?.value,
  });
  if (res.success) { Toast.success('Siswa berhasil ditambahkan.'); Modal.close(); loadSiswa(); }
  else Toast.error(res.message);
}

function ajukanPromosiSiswa(siswaId) {
  const jenjangTujuan = _activeJenjang === 'SD' ? 'SMP' : 'SMA';
  Modal.open('⬆️ Konfirmasi Promosi', `
    <p>Ajukan promosi siswa ini ke jenjang <strong>${jenjangTujuan}</strong>?</p>
    <p style="margin-top:8px;font-size:13px;color:#6b7280;">Pengajuan akan dikirim ke TU ${jenjangTujuan} untuk dikonfirmasi (Maker-Checker).</p>`,
    {
      confirmText: `Ajukan ke ${jenjangTujuan}`,
      confirmClass: 'btn-warning',
      onConfirm: async () => {
        const res = await API.ajukanPromosi(_activeJenjang, siswaId);
        if (res.success) { Toast.success(res.message); loadSiswa(); }
        else Toast.error(res.message);
      }
    });
}
</script>

<script>
registerPage('template-reg', async function(container) {
  if (!Session.isKepalaTU()) {
    container.innerHTML = `<div class="loading-page"><p>⛔ Akses ditolak. Hanya Kepala TU.</p></div>`;
    return;
  }
  container.innerHTML = document.getElementById('templateRegPage').innerHTML;
  await loadTemplates();
});

async function loadTemplates() {
  const tbody = document.getElementById('tbodyTemplate');
  tbody.innerHTML = `<tr><td colspan="7" class="table-empty"><div class="loading-spinner" style="margin:0 auto;width:24px;height:24px;"></div></td></tr>`;
  try {
    const res = await API.getTemplates('');  // Semua jenjang
    if (!res.data || res.data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" class="table-empty">Belum ada template. Tambah template baru.</td></tr>`;
      return;
    }
    tbody.innerHTML = res.data.map(t => `
      <tr>
        <td style="font-weight:600;">${escHtml(t.nama)}</td>
        <td><span class="badge badge-gray">${escHtml(t.kodeSurat)}</span></td>
        <td><code>${escHtml(t.klasifikasi)}</code></td>
        <td style="font-size:11px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escHtml(t.placeholders?.join(', ')||'')}">
          <code>${escHtml(t.placeholders?.join(', ')||'—')}</code>
        </td>
        <td><span class="badge badge-info">${escHtml(t.jenjang)}</span></td>
        <td>${t.aktif ? '<span class="badge badge-success">AKTIF</span>' : '<span class="badge badge-danger">NONAKTIF</span>'}</td>
        <td style="text-align:center;white-space:nowrap;">
          <a href="https://docs.google.com/document/d/${escHtml(t.docId)}/edit" target="_blank" class="btn btn-sm btn-secondary">📝 Edit Doc</a>
          <button class="btn btn-sm ${t.aktif?'btn-danger':'btn-success'}" onclick="toggleTpl('${t.id}',${!t.aktif})">
            ${t.aktif ? 'Nonaktifkan' : 'Aktifkan'}
          </button>
        </td>
      </tr>`).join('');
  } catch(e) { Toast.error('Gagal: ' + e.message); }
}

function openFormTemplate() {
  const tpl = document.getElementById('tplFormTemplate');
  Modal.open('➕ Tambah Template Surat', tpl.innerHTML, { hideFooter: true, large: true });
}

async function simpanTemplate() {
  const nama   = document.getElementById('tplNama')?.value?.trim();
  const docUrl = document.getElementById('tplDocUrl')?.value?.trim();
  const kode   = document.getElementById('tplKode')?.value?.trim();
  const ph     = document.getElementById('tplPlaceholders')?.value?.trim();
  if (!nama || !docUrl || !kode) { Toast.warn('Nama, URL Doc, dan Kode Surat wajib diisi.'); return; }
  const res = await API.tambahTemplate({
    nama,
    docUrl,
    kodeSurat    : kode,
    klasifikasi  : document.getElementById('tplKlasifikasi')?.value || '00.00',
    jenjang      : document.getElementById('tplJenjang')?.value || 'SEMUA',
    placeholders : ph ? ph.split(',').map(s=>s.trim()) : [],
    keterangan   : document.getElementById('tplKeterangan')?.value,
  });
  if (res.success) { Toast.success('Template berhasil ditambahkan.'); Modal.close(); loadTemplates(); }
  else Toast.error(res.message);
}

async function toggleTpl(id, aktif) {
  const res = await API.toggleTemplate(id, aktif);
  if (res.success) { Toast.success(res.message); loadTemplates(); }
  else Toast.error(res.message);
}
</script>

        <select class="form-control" id="usrRole" onchange="updateJenjangOptions()">
          <option value="TU_SD">TU SD</option>
          <option value="TU_SMP">TU SMP</option>
          <option value="TU_SMA">TU SMA</option>
          <option value="KEPALA_TU">Kepala TU</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Jenjang</label>
        <select class="form-control" id="usrJenjang">
          <option value="SD">SD</option>
          <option value="SMP">SMP</option>
          <option value="SMA">SMA</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Telegram Chat ID</label>
        <input type="text" class="form-control" id="usrTelegramId" placeholder="123456789">
        <span class="form-hint">Chat ke bot, ketik /start, lalu cek di <a href="https://t.me/userinfobot" target="_blank">@userinfobot</a></span>
      </div>
      <div class="form-group full">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="usrEmail" placeholder="email@sekolah.sch.id">
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="Modal.close()">Batal</button>
      <button class="btn btn-primary" onclick="simpanUser()">💾 Simpan User</button>
    </div>
  </template>

</template>

<script>
registerPage('users', async function(container) {
  if (!Session.isKepalaTU()) {
    container.innerHTML = `<div class="loading-page"><p>⛔ Akses ditolak. Hanya Kepala TU.</p></div>`;
    return;
  }
  container.innerHTML = document.getElementById('usersPage').innerHTML;
  await loadUsers();
});

async function loadUsers() {
  const tbody = document.getElementById('tbodyUsers');
  try {
    const res = await API.getUsers();
    if (!res.data) return;
    const users = res.data;
    // Count per role
    const cnt = { KEPALA_TU:0, TU_SD:0, TU_SMP:0, TU_SMA:0 };
    users.filter(u=>u.status==='AKTIF').forEach(u => { if(cnt[u.role]!==undefined) cnt[u.role]++; });
    document.getElementById('cntKepala').textContent = cnt['KEPALA_TU'];
    document.getElementById('cntSD').textContent     = `${cnt['TU_SD']}/2`;
    document.getElementById('cntSMP').textContent    = `${cnt['TU_SMP']}/2`;
    document.getElementById('cntSMA').textContent    = `${cnt['TU_SMA']}/2`;

    if (users.length === 0) { tbody.innerHTML = `<tr><td colspan="8" class="table-empty">Belum ada user.</td></tr>`; return; }
    tbody.innerHTML = users.map(u => `
      <tr>
        <td style="font-weight:600;font-family:monospace;">${escHtml(u.username)}</td>
        <td>${escHtml(u.nama)}</td>
        <td><span class="badge badge-info">${escHtml(u.role?.replace('_',' '))}</span></td>
        <td>${escHtml(u.jenjang||'—')}</td>
        <td style="font-family:monospace;font-size:12px;">${escHtml(u.telegramId||'—')}</td>
        <td>${fmtTanggal(u.lastLogin)}</td>
        <td>${statusBadge(u.status)}</td>
        <td style="text-align:center;">
          ${u.status==='AKTIF' && u.username !== Session.username
            ? `<button class="btn btn-sm btn-danger" onclick="nonaktifUser('${u.id}','${escHtml(u.nama)}')">Nonaktifkan</button>`
            : '—'}
        </td>
      </tr>`).join('');
  } catch(e) { Toast.error('Gagal: ' + e.message); }
}

function openFormUser() {
  const tpl = document.getElementById('tplFormUser');
  Modal.open('➕ Tambah User Baru', tpl.innerHTML, { hideFooter: true, large: true });
  updateJenjangOptions();
}

function updateJenjangOptions() {
  const role = document.getElementById('usrRole')?.value;
  const jenjangEl = document.getElementById('usrJenjang');
  if (!jenjangEl) return;
  if (role === 'KEPALA_TU') { jenjangEl.value='SD'; jenjangEl.disabled=false; }
  else {
    const map = { TU_SD:'SD', TU_SMP:'SMP', TU_SMA:'SMA' };
    jenjangEl.value    = map[role]||'SD';
    jenjangEl.disabled = true;
  }
}

async function simpanUser() {
  const username = document.getElementById('usrUsername')?.value?.trim();
  const password = document.getElementById('usrPassword')?.value;
  const nama     = document.getElementById('usrNama')?.value?.trim();
  const role     = document.getElementById('usrRole')?.value;
  if (!username || !password || !nama || !role) { Toast.warn('Lengkapi semua field wajib.'); return; }
  if (password.length < 8) { Toast.warn('Password minimal 8 karakter.'); return; }
  const res = await API.tambahUser({ username, password, nama, role,
    jenjang    : document.getElementById('usrJenjang')?.value,
    telegramId : document.getElementById('usrTelegramId')?.value,
    email      : document.getElementById('usrEmail')?.value,
  });
  if (res.success) { Toast.success('User berhasil ditambahkan.'); Modal.close(); loadUsers(); }
  else Toast.error(res.message);
}

function nonaktifUser(id, nama) {
  Modal.open('⚠️ Nonaktifkan User', `<p>Nonaktifkan akun <strong>${escHtml(nama)}</strong>?<br><small style="color:#6b7280;">User tidak akan bisa login sampai diaktifkan kembali.</small></p>`,
    { confirmText:'Nonaktifkan', confirmClass:'btn-danger',
      onConfirm: async () => {
        const res = await API.nonaktifUser(id);
        if (res.success) { Toast.success('User dinonaktifkan.'); loadUsers(); }
        else Toast.error(res.message);
      }
    });
}
</script>

<template id="configPage">

  <div class="page-header">
    <div><h2>⚙️ Konfigurasi Sistem</h2><p>Ubah pengaturan sistem tanpa menyentuh kode</p></div>
    <button class="btn btn-secondary" onclick="loadConfig()">🔄 Refresh</button>
  </div>

  <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:13px;">
    ⚠️ <strong>Perhatian:</strong> Perubahan di halaman ini berlaku langsung ke sistem. Pastikan nilai yang diisi sudah benar.
    Jangan mengubah nilai pada baris <code>NO_URUT_*</code> kecuali dalam kondisi darurat.
  </div>

  <div id="configSections">
    <div class="loading-page"><div class="loading-spinner"></div></div>
  </div>

</template>

<script>
registerPage('config', async function(container) {
  if (!Session.isKepalaTU()) {
    container.innerHTML = `<div class="loading-page"><p>⛔ Akses ditolak. Hanya Kepala TU.</p></div>`;
    return;
  }
  container.innerHTML = document.getElementById('configPage').innerHTML;
  await loadConfig();
});

async function loadConfig() {
  const wrap = document.getElementById('configSections');
  wrap.innerHTML = `<div class="loading-page"><div class="loading-spinner"></div></div>`;
  try {
    const res = await API.getConfig();
    if (!res.data) { wrap.innerHTML = '<p>Gagal memuat config.</p>'; return; }
    const sections = groupConfigSections(res.data);
    wrap.innerHTML = sections.map(sec => `
      <div class="card" style="margin-bottom:16px;">
        <div class="card-header"><span class="card-title">${escHtml(sec.title)}</span></div>
        <div class="card-body" style="padding:0;">
          <table style="width:100%;">
            <thead>
              <tr style="background:#f8fafc;">
                <th style="padding:10px 16px;font-size:12px;color:#6b7280;width:30%;">KEY</th>
                <th style="padding:10px 16px;font-size:12px;color:#6b7280;">VALUE</th>
                <th style="padding:10px 16px;font-size:12px;color:#6b7280;width:30%;">KETERANGAN</th>
                <th style="padding:10px 16px;width:80px;"></th>
              </tr>
            </thead>
            <tbody>
              ${sec.rows.map(r => `
                <tr style="border-top:1px solid #f1f5f9;">
                  <td style="padding:10px 16px;font-family:monospace;font-size:12px;color:#1557b0;font-weight:600;">${escHtml(r.key)}</td>
                  <td style="padding:8px 16px;">
                    <input type="text" class="form-control" id="cfg_${escHtml(r.key)}"
                      value="${escHtml(String(r.value||''))}"
                      ${r.key.startsWith('NO_URUT') ? 'style="font-family:monospace;background:#fff8f0;"' : ''}
                      ${r.key.startsWith('---') ? 'disabled style="background:transparent;border:none;font-weight:700;"' : ''}>
                  </td>
                  <td style="padding:10px 16px;font-size:12px;color:#9ca3af;">${escHtml(r.keterangan||'')}</td>
                  <td style="padding:8px 16px;">
                    ${!r.key.startsWith('---') ? `<button class="btn btn-sm btn-primary" onclick="saveConfig('${escHtml(r.key)}')">Simpan</button>` : ''}
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`).join('');
  } catch(e) { Toast.error('Gagal: ' + e.message); }
}

function groupConfigSections(dataObj) {
  const sections = [];
  let currentSection = { title: 'Umum', rows: [] };
  Object.entries(dataObj).forEach(([key, val]) => {
    if (key.startsWith('---')) {
      if (currentSection.rows.length > 0) sections.push(currentSection);
      currentSection = { title: key.replace(/---/g,'').trim() || 'Lainnya', rows: [] };
    } else {
      currentSection.rows.push({ key, value: val, keterangan: '' });
    }
  });
  if (currentSection.rows.length > 0) sections.push(currentSection);
  return sections;
}

async function saveConfig(key) {
  const input = document.getElementById(`cfg_${key}`);
  if (!input) return;
  const val = input.value;
  const res = await API.setConfig(key, val);
  if (res.success) Toast.success(`${key} diperbarui.`);
  else Toast.error(res.message);
}
</script>

async function loadAuditLog() {
  const limit = document.getElementById('auditLimit')?.value || 50;
  const tbody = document.getElementById('tbodyAudit');
  tbody.innerHTML = `<tr><td colspan="5" class="table-empty"><div class="loading-spinner" style="margin:0 auto;width:24px;height:24px;"></div></td></tr>`;
  try {
    const res = await API.getAuditLog(limit);
    if (!res.data || res.data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="table-empty">Belum ada log.</td></tr>`; return;
    }
    tbody.innerHTML = res.data.map(a => `
      <tr>
        <td style="white-space:nowrap;font-size:12px;">${fmtTanggal(a.timestamp)}</td>
        <td style="font-weight:600;">${escHtml(a.username)}</td>
        <td><code style="font-size:11px;background:#f1f5f9;padding:2px 6px;border-radius:4px;">${escHtml(a.aksi)}</code></td>
        <td style="font-size:12px;color:#6b7280;">${escHtml(a.detail)}</td>
        <td><span class="badge badge-gray">${escHtml(a.platform||'—')}</span></td>

  } catch(e) { Toast.error('Gagal: ' + e.message); }
}
